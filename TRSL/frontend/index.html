<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <base href="/trsl/">
    <title>TWUMVANE | 3D Avatar Sign Translator</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="shortcut icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'sans': ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        primary: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        surface: { DEFAULT: '#09090b', card: '#0f1117', elevated: '#181b26', border: '#252a3a' }
                    },
                    boxShadow: {
                        'card': '0 8px 20px -6px rgba(0,0,0,0.6), 0 0 0 1px rgba(59,130,246,0.1)',
                        'glow-blue': '0 0 12px rgba(59,130,246,0.5)'
                    }
                }
            }
        }
    </script>
    <style>
        * { scrollbar-width: thin; scrollbar-color: #3b82f6 #1e1f2e; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f1117; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        body { background: #09090b; font-family: 'Inter', sans-serif; }

        /* ── Sidebar transitions (brighter, clean solid tone) ── */
        aside {
            background-color: #161b26 !important;
            transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), width 0.25s ease;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        /* Desktop collapsed */
        .sidebar-collapsed aside {
            transform: translateX(-100%);
            width: 0 !important;
            min-width: 0 !important;
            overflow: hidden;
            border-right: none;
            padding: 0;
        }

        /* Mobile overlay sidebar - Extra bright & high contrast */
        @media (max-width: 767px) {
            aside {
                position: fixed !important;
                top: 0; left: 0;
                width: 82vw !important;
                max-width: 320px;
                height: 100% !important;
                z-index: 40;
                transform: translateX(-100%);
                box-shadow: 6px 0 35px rgba(0,0,0,0.85);
                background-color: #22293a !important;
                border-right: 1px solid rgba(255,255,255,0.18) !important;
            }
            aside.mobile-open {
                transform: translateX(0) !important;
            }
            aside > div:first-child {
                background-color: #283145 !important;
                border-bottom: 1px solid rgba(255,255,255,0.12) !important;
            }
            aside #signSearchInput {
                background-color: #2c364d !important;
                border-color: #475577 !important;
                color: #ffffff !important;
            }
            aside .lexicon-chip {
                background-color: #2e3850 !important;
                border-color: #4c5b80 !important;
                color: #ffffff !important;
                font-weight: 600 !important;
            }
            aside .recent-item {
                background-color: #2a3349 !important;
                border-color: #435172 !important;
                color: #ffffff !important;
            }
            aside > div:last-child {
                background-color: #1e2434 !important;
                border-top: 1px solid rgba(255,255,255,0.12) !important;
            }
            /* Semi-transparent backdrop */
            #sidebarBackdrop {
                display: none;
                position: fixed; inset: 0;
                background: rgba(0, 0, 0, 0.7);
                z-index: 39;
            }
            #sidebarBackdrop.active { display: block; }
        }

        .chat-card {
            background: #0f1117;
            border: 1px solid #252a3a;
            transition: all 0.2s;
        }
        .chat-card:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .lexicon-chip {
            display: inline-flex;
            align-items: center;
            padding: 0.38rem 0.9rem;
            border-radius: 2rem;
            font-size: 0.72rem;
            font-weight: 600;
            background: #232a3b;
            color: #e2e8f0;
            border: 1px solid #36415d;
            transition: all 0.15s;
            cursor: pointer;
        }
        .lexicon-chip:hover { background: #3b82f6; border-color: #60a5fa; color: white; transform: translateY(-1px); }

        .sequence-chip {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            background: #181b26;
            border: 1px solid #2a2f42;
            transition: all 0.2s;
            cursor: pointer;
        }
        .sequence-chip.missing { background: rgba(244,63,94,0.12); border-color: #f43f5e40; color: #fda4af; }
        .sequence-chip.active { background: #3b82f6; border-color: #3b82f6; color: white; box-shadow: 0 4px 12px rgba(59,130,246,0.3); transform: scale(1.02); }

        textarea {
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            font-size: 0.9rem;
            font-weight: 500;
            color: #f0f3fa;
            line-height: 1.5rem;
            width: 100%;
            padding: 0.5rem 0;
        }
        textarea::placeholder { color: #4a4f6e; font-weight: 450; font-size: 0.85rem; }

        .recent-item {
            transition: all 0.15s ease;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .recent-item:hover { background: #1e2438; transform: translateX(2px); }

        .avatar-stage {
            background: radial-gradient(ellipse at center, #10182c 0%, #05070d 70%);
            min-height: 380px;
        }

        /* ── Speed card responsive ── */
        #speedMenu {
            /* default: pops above the button */
            position: absolute;
            bottom: calc(100% + 8px);
            right: 0;
            z-index: 50;
        }
        @media (max-width: 400px) {
            #speedMenu {
                right: auto;
                left: 0;
                min-width: 130px;
            }
        }

        /* ── Mobile input area ── */
        @media (max-width: 767px) {
            .bottom-input-area { padding: 0.75rem 0.75rem 1rem; }
            textarea { font-size: 0.85rem; }
        }
    </style>
</head>
<body class="bg-surface text-gray-200 antialiased h-screen flex overflow-hidden">

    <div class="fixed inset-0 pointer-events-none opacity-10 z-0" style="background-image: radial-gradient(#3b82f6 0.5px, transparent 0.5px); background-size: 32px 32px;"></div>

    <!-- Mobile sidebar backdrop -->
    <div id="sidebarBackdrop"></div>

    <!-- SIDEBAR -->
    <aside id="mainSidebar" class="w-80 bg-[#161b26] border-r border-slate-700/70 flex flex-col h-full z-20 shrink-0 shadow-xl">
        <div class="p-4 md:p-5 flex items-center justify-between border-b border-slate-700/60 bg-[#181e2b]">
            <a href="/" class="flex items-center gap-3 hover:opacity-90 transition-all active:scale-95 group">
                <div class="w-11 h-11 rounded-xl bg-white shadow-md p-1 border border-white/20 flex items-center justify-center shrink-0 group-hover:scale-105 transition-transform overflow-hidden">
                    <img src="logo.jpg" alt="TWUMVANE" class="w-full h-full object-contain" onerror="this.onerror=null; this.src='/logo.jpg';">
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight text-white flex items-center gap-1.5">TWUMVANE<span class="text-primary-400 text-[10px] px-1.5 py-0.5 bg-primary-500/20 rounded font-bold">AVATAR</span></h1>
                    <p class="text-[9px] font-bold text-gray-400 tracking-wider uppercase">3D sign synthesis</p>
                </div>
            </a>
            <button id="sidebarCloseBtn" class="w-8 h-8 rounded-lg hover:bg-white/10 text-gray-300 hover:text-white transition flex items-center justify-center">
                <i class="fas fa-times text-xs"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-6 custom-scroll">
            <div>
                <div class="flex justify-between items-center mb-3 px-1">
                    <p class="text-[10px] font-bold text-gray-300 uppercase tracking-wider flex items-center gap-1.5"><span>⚡</span> Animated signs</p>
                    <span id="dbSignCount" class="text-[9px] font-mono font-bold bg-primary-500/25 text-primary-300 border border-primary-500/30 px-2 py-0.5 rounded-full">0 terms</span>
                </div>
                <div class="relative mb-3">
                    <i class="fas fa-search absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-[10px]"></i>
                    <input type="text" id="signSearchInput" class="w-full bg-[#202738] border border-[#333d56] rounded-lg py-1.5 pl-8 pr-2 text-xs text-white placeholder-gray-400 focus:border-primary-500 focus:bg-[#252f44] outline-none transition" placeholder="Search animated signs...">
                </div>
                <div id="signsList" class="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto custom-scroll pb-1">
                    <div class="text-center w-full text-[10px] text-gray-400 py-3">loading...</div>
                </div>
            </div>

            <div class="mt-2">
                <div class="flex items-center gap-2 mb-3 px-1">
                    <i class="fas fa-clock text-[10px] text-primary-400"></i>
                    <p class="text-[10px] font-bold text-gray-300 uppercase tracking-wider">Recent translations</p>
                </div>
                <div id="recentTranslationsList" class="space-y-1.5 max-h-56 overflow-y-auto custom-scroll pr-1">
                    <div class="text-center text-[10px] text-gray-400 py-4 italic">No recent translations yet</div>
                </div>
            </div>
        </div>

        <div class="p-4 border-t border-slate-700/60 bg-[#141822]">
            <div class="flex items-center gap-2.5">
                <div class="w-8 h-8 rounded-full bg-primary-500/20 border border-primary-500/30 flex items-center justify-center"><i class="fas fa-cube text-primary-300 text-xs"></i></div>
                <div><p class="text-xs font-bold text-gray-200">3D Avatar engine</p><p id="translationModeBadge" class="text-[9px] text-emerald-400 font-bold uppercase tracking-wider">● ready</p></div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden">
        <!-- Open sidebar button (always visible; on desktop only shown when collapsed) -->
        <button id="sidebarOpenBtn" class="fixed top-4 left-4 z-30 w-9 h-9 rounded-xl bg-surface-elevated/90 backdrop-blur border border-surface-border shadow-lg flex items-center justify-center text-gray-300 hover:text-white hover:border-primary-500 transition-all opacity-0 scale-90 pointer-events-none md:top-5 md:left-5">
            <i class="fas fa-bars text-sm"></i>
        </button>

        <!-- Scrollable content area -->
        <div class="flex-1 overflow-y-auto custom-scroll">
            <div id="mainContentCenter" class="max-w-4xl mx-auto w-full transition-all duration-500 flex flex-col px-4 py-5 md:px-8 md:py-8 gap-5">

                <!-- Avatar output card -->
                <div id="avatarCard" class="avatar-stage rounded-2xl overflow-hidden border border-surface-border shadow-2xl relative group w-full aspect-video min-h-[380px] md:min-h-[440px]">
                    <div id="avatarLoaderOverlay" class="absolute inset-0 bg-black/80 backdrop-blur-sm z-20 flex flex-col items-center justify-center">
                        <div class="w-10 h-10 border-2 border-primary-500/30 border-t-primary-500 rounded-full animate-spin mb-3"></div>
                        <p class="text-[10px] font-mono text-gray-300">loading 3D avatar...</p>
                    </div>
                    <canvas id="avatarCanvas" class="w-full h-full object-contain"></canvas>
                    <div id="signMissingLabel" class="absolute inset-0 flex items-center justify-center text-gray-400 text-sm font-bold hidden px-6 text-center"></div>

                    <div class="absolute inset-x-0 bottom-0 p-3 pt-10 bg-gradient-to-t from-black/90 via-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-all duration-200 pointer-events-none">
                        <div class="flex items-center justify-between pointer-events-auto">
                            <div><span class="text-[9px] font-bold text-primary-400 uppercase">current sign</span><h3 id="activeWordLabel" class="text-lg md:text-xl font-black tracking-tight">—</h3></div>
                            <div class="flex gap-1.5 md:gap-2">
                                <button id="prevSignBtn" class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 hover:bg-primary-600 disabled:opacity-30"><i class="fas fa-chevron-left text-[10px]"></i></button>
                                <button id="replaySignBtn" class="w-9 h-9 rounded-xl bg-primary-600 shadow-md hover:bg-primary-500 flex items-center justify-center"><i class="fas fa-rotate text-xs"></i></button>
                                <button id="nextSignBtn" class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 hover:bg-primary-600 disabled:opacity-30"><i class="fas fa-chevron-right text-[10px]"></i></button>
                                <button id="fullscreenAvatarBtn" class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 hover:bg-primary-600"><i class="fas fa-expand text-[10px]"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="absolute top-3 right-3 bg-black/50 backdrop-blur px-2 py-1 rounded-lg text-[9px] font-mono"><span id="signIndexIndicator">0/0</span></div>
                </div>

                <!-- ── TYPE BAR (input) — above sign sequence ── -->
                <div class="w-full">
                    <div class="chat-card rounded-2xl p-2 flex items-end gap-2 transition-all">
                        <!-- Speed button -->
                        <div class="relative shrink-0">
                            <button id="speedBtn" class="w-9 h-9 rounded-full flex items-center justify-center gap-1 text-gray-400 hover:text-primary-500 transition-all">
                                <i class="fas fa-gauge-high text-sm"></i>
                                <span id="speedLabel" class="text-[9px] font-bold">1x</span>
                            </button>
                            <div id="speedMenu" class="hidden bg-surface-elevated border border-surface-border rounded-xl shadow-2xl p-1.5 min-w-[120px]">
                                <button data-speed="0.5"  class="speed-option w-full text-left px-3 py-1.5 rounded-lg text-[10px] font-bold text-gray-300 hover:bg-primary-600 hover:text-white transition">0.5x — Slow</button>
                                <button data-speed="0.75" class="speed-option w-full text-left px-3 py-1.5 rounded-lg text-[10px] font-bold text-gray-300 hover:bg-primary-600 hover:text-white transition">0.75x</button>
                                <button data-speed="1"    class="speed-option w-full text-left px-3 py-1.5 rounded-lg text-[10px] font-bold text-gray-300 hover:bg-primary-600 hover:text-white transition">1x — Normal</button>
                                <button data-speed="1.25" class="speed-option w-full text-left px-3 py-1.5 rounded-lg text-[10px] font-bold text-gray-300 hover:bg-primary-600 hover:text-white transition">1.25x</button>
                                <button data-speed="1.5"  class="speed-option w-full text-left px-3 py-1.5 rounded-lg text-[10px] font-bold text-gray-300 hover:bg-primary-600 hover:text-white transition">1.5x</button>
                                <button data-speed="2"    class="speed-option w-full text-left px-3 py-1.5 rounded-lg text-[10px] font-bold text-gray-300 hover:bg-primary-600 hover:text-white transition">2x — Fast</button>
                            </div>
                        </div>
                        <!-- Mic button -->
                        <button id="micInputBtn" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-400 hover:text-primary-500 transition-all shrink-0"><i class="fas fa-microphone text-sm"></i></button>
                        <!-- Text area -->
                        <textarea id="mainTextarea" rows="1" placeholder="Type a Kinyarwanda sentence... e.g. 'muraho mama'" class="flex-1 text-sm py-2 px-1 max-h-28"></textarea>
                        <!-- Send button -->
                        <button id="sendTranslateBtn" class="w-10 h-10 rounded-full bg-primary-600 hover:bg-primary-500 shadow-md flex items-center justify-center text-white transition active:scale-95 shrink-0">
                            <i class="fas fa-paper-plane text-sm"></i>
                        </button>
                    </div>
                    <p class="text-[9px] text-center text-gray-600 mt-2 font-mono tracking-wider">TWUMVANE · 3D Sign Avatar</p>
                </div>

                <!-- Translation Path Card (Sign sequence) — below type bar -->
                <div id="chipsCard" class="bg-surface-card rounded-xl border border-surface-border p-4 md:p-5 shadow-card transition-all">
                    <div class="flex items-center justify-center gap-2 mb-4">
                        <div class="w-1.5 h-1.5 rounded-full bg-primary-500 shadow-glow-blue"></div>
                        <span class="text-[9px] font-black text-gray-500 uppercase tracking-wider">Sign sequence</span>
                    </div>
                    <div id="sequenceChipsWrapper" class="flex flex-wrap gap-2 md:gap-3 min-h-[60px] justify-center items-center">
                        <div class="w-full text-center text-gray-500 text-xs py-3 italic">Enter text → press send → the avatar signs each word it knows</div>
                    </div>
                </div>

            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="avatar.js"></script>
    <script>
        const avatarCanvas = document.getElementById('avatarCanvas');
        const signMissingLabel = document.getElementById('signMissingLabel');
        const avatarCard = document.getElementById('avatarCard');
        const loaderOverlay = document.getElementById('avatarLoaderOverlay');
        const loaderText = loaderOverlay ? loaderOverlay.querySelector('p') : null;

        try {
            AvatarPlayer.init(avatarCanvas, 'models/twumvane.glb', {
                onProgress: (percent, loaded) => {
                    if (loaderText) {
                        if (percent > 0) {
                            loaderText.innerText = `Loading 3D avatar... ${percent}%`;
                        } else if (loaded > 0) {
                            loaderText.innerText = `Loading 3D avatar... ${(loaded / (1024 * 1024)).toFixed(1)} MB`;
                        }
                    }
                },
                onLoad: () => {
                    if (loaderOverlay) {
                        loaderOverlay.style.transition = 'opacity 0.35s ease';
                        loaderOverlay.style.opacity = '0';
                        setTimeout(() => { loaderOverlay.classList.add('hidden'); }, 350);
                    }
                },
                onError: (err) => {
                    console.error('Avatar failed to load:', err);
                    if (loaderText) {
                        const msg = (err && err.message) ? err.message : 'Ensure WebGL and Hardware Acceleration are enabled in your browser.';
                        loaderText.innerHTML = `
                            <span class="text-rose-400 font-bold text-xs">Failed to load 3D avatar</span><br>
                            <span class="text-gray-400 text-[10px] block mt-1 max-w-xs leading-relaxed">${msg}</span>
                            <button onclick="location.reload()" class="mt-3 px-3 py-1 bg-primary-600 hover:bg-primary-500 text-white rounded text-[10px] font-bold shadow transition">Retry</button>
                        `;
                    }
                }
            });
        } catch (err) {
            console.error('Avatar failed to initialize:', err);
        }

        let currentSequence = [];
        let currentIdx = 0;
        let isSigning = false;
        let recentTranslationsQueue = JSON.parse(localStorage.getItem('trsl_recent_avatar') || '[]');
        const chipsWrapper = document.getElementById('sequenceChipsWrapper');
        const textarea = document.getElementById('mainTextarea');
        const micBtn = document.getElementById('micInputBtn');
        const sendBtn = document.getElementById('sendTranslateBtn');
        const activeWordLabel = document.getElementById('activeWordLabel');
        const signIndexSpan = document.getElementById('signIndexIndicator');
        const replayBtn = document.getElementById('replaySignBtn');
        const prevBtn = document.getElementById('prevSignBtn');
        const nextBtn = document.getElementById('nextSignBtn');
        const fullscreenBtn = document.getElementById('fullscreenAvatarBtn');
        const speedBtn = document.getElementById('speedBtn');
        const speedLabel = document.getElementById('speedLabel');
        const speedMenu = document.getElementById('speedMenu');
        const dbCountSpan = document.getElementById('dbSignCount');
        const signsContainer = document.getElementById('signsList');
        const recentContainer = document.getElementById('recentTranslationsList');
        const searchInput = document.getElementById('signSearchInput');

        function hasSign(word) { return AvatarPlayer.has(word); }

        const allAnimatedWords = Object.keys(SIGN_ANIMATIONS || {});

        function renderLexicon(wordsArr) {
            if (!wordsArr.length) { signsContainer.innerHTML = '<div class="text-center w-full text-[10px] text-gray-500">no signs yet</div>'; return; }
            signsContainer.innerHTML = wordsArr.map(w => `<span class="lexicon-chip" data-word="${w}">${w}</span>`).join('');
            document.querySelectorAll('.lexicon-chip').forEach(el => {
                el.addEventListener('click', () => addToTextarea(el.getAttribute('data-word')));
            });
        }

        function filterLexicon(query) {
            if (!query.trim()) renderLexicon(allAnimatedWords);
            else renderLexicon(allAnimatedWords.filter(w => w.toLowerCase().includes(query.toLowerCase())));
        }

        function addToTextarea(word) {
            const cur = textarea.value;
            textarea.value = cur + (cur ? ' ' : '') + word;
            textarea.dispatchEvent(new Event('input'));
            textarea.focus();
        }

        function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }

        function addRecentTranslation(originalText) {
            recentTranslationsQueue = recentTranslationsQueue.filter(r => r.text !== originalText);
            const truncated = originalText.length > 40 ? originalText.slice(0, 40) + '...' : originalText;
            recentTranslationsQueue.unshift({ text: originalText, display: truncated, timestamp: Date.now() });
            if (recentTranslationsQueue.length > 10) recentTranslationsQueue.pop();
            localStorage.setItem('trsl_recent_avatar', JSON.stringify(recentTranslationsQueue));
            renderRecentList();
        }

        function renderRecentList() {
            if (recentTranslationsQueue.length === 0) {
                recentContainer.innerHTML = '<div class="text-center text-[10px] text-gray-400 py-4 italic">No recent translations</div>';
                return;
            }
            recentContainer.innerHTML = recentTranslationsQueue.map(item => `
                <div class="recent-item bg-[#1e2536] hover:bg-[#273046] rounded-lg px-3 py-2 flex items-center justify-between group transition border border-[#2e3952] hover:border-primary-500/50">
                    <span class="text-[11px] font-semibold text-gray-200 truncate max-w-[180px]">${escapeHtml(item.display)}</span>
                    <i class="fas fa-rotate-right text-[9px] text-primary-400 opacity-0 group-hover:opacity-100 transition"></i>
                </div>
            `).join('');
            document.querySelectorAll('.recent-item').forEach((el, idx) => {
                el.addEventListener('click', () => {
                    const item = recentTranslationsQueue[idx];
                    textarea.value = item.text;
                    textarea.dispatchEvent(new Event('input'));
                    translateText();
                });
            });
        }

        function setSendButtonMode(signing) {
            sendBtn.classList.toggle('bg-rose-600', signing);
            sendBtn.classList.toggle('hover:bg-rose-500', signing);
            sendBtn.classList.toggle('bg-primary-600', !signing);
            sendBtn.classList.toggle('hover:bg-primary-500', !signing);
            sendBtn.innerHTML = signing ? '<i class="fas fa-stop text-sm"></i>' : '<i class="fas fa-paper-plane text-sm"></i>';
            sendBtn.title = signing ? 'Stop signing' : 'Send to avatar';
        }

        function stopSigning() {
            isSigning = false;
            AvatarPlayer.stop();
            setSendButtonMode(false);
        }

        function translateText() {
            const rawText = textarea.value.trim();
            if (!rawText) return;
            const words = rawText.toLowerCase().split(/\s+/).filter(Boolean);
            if (!words.length) return;

            currentSequence = words.map(word => ({ word }));
            currentIdx = 0;
            signMissingLabel.classList.add('hidden');
            activeWordLabel.innerText = '';
            renderSequenceChips();
            addRecentTranslation(rawText);

            const first = findNextSignable(-1);
            if (first !== -1) playWord(first);
            else {
                signMissingLabel.classList.remove('hidden');
                signMissingLabel.innerText = `No animated signs found for "${rawText}"`;
                signIndexSpan.innerText = `0/${currentSequence.length}`;
                updateNavButtons();
            }
        }

        function renderSequenceChips() {
            if (!currentSequence.length) {
                chipsWrapper.innerHTML = `<div class="w-full text-center text-gray-500 text-xs py-3 italic">Empty sequence</div>`;
                return;
            }
            chipsWrapper.innerHTML = currentSequence.map((item, i) => `
                <div class="sequence-chip ${!hasSign(item.word) ? 'missing' : ''} ${i === currentIdx ? 'active' : ''}" data-chip-index="${i}">
                    ${item.word} ${!hasSign(item.word) ? '⚠️' : ''}
                </div>
            `).join('');
            document.querySelectorAll('.sequence-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const idx = parseInt(chip.getAttribute('data-chip-index'));
                    if (hasSign(currentSequence[idx].word)) playWord(idx);
                });
            });
        }

        function findNextSignable(fromIdx) {
            for (let i = fromIdx + 1; i < currentSequence.length; i++) {
                if (hasSign(currentSequence[i].word)) return i;
            }
            return -1;
        }

        function findPrevSignable(fromIdx) {
            for (let i = fromIdx - 1; i >= 0; i--) {
                if (hasSign(currentSequence[i].word)) return i;
            }
            return -1;
        }

        function playWord(idx) {
            if (!currentSequence[idx]) return;
            const item = currentSequence[idx];
            currentIdx = idx;
            activeWordLabel.innerText = item.word;
            signIndexSpan.innerText = `${currentIdx + 1}/${currentSequence.length}`;
            signMissingLabel.classList.add('hidden');

            const played = AvatarPlayer.playWord(item.word, () => { playNext(); });
            if (played) { isSigning = true; setSendButtonMode(true); }
            if (!played) playNext();
            updateActiveChipClass();
            updateNavButtons();
        }

        function playNext() {
            if (currentSequence.length === 0) return;
            const nxt = findNextSignable(currentIdx);
            if (nxt !== -1) playWord(nxt);
            else {
                activeWordLabel.innerText = currentSequence[currentIdx].word + ' ✓';
                isSigning = false;
                setSendButtonMode(false);
                updateNavButtons();
            }
        }

        function playPrev() {
            if (currentSequence.length === 0) return;
            const prv = findPrevSignable(currentIdx);
            if (prv !== -1) playWord(prv);
        }

        function updateActiveChipClass() {
            document.querySelectorAll('.sequence-chip').forEach((chip, i) => {
                if (i === currentIdx) chip.classList.add('active');
                else chip.classList.remove('active');
            });
        }

        function updateNavButtons() {
            let hasPrev = false, hasNext = false;
            for (let i = 0; i < currentIdx; i++) if (hasSign(currentSequence[i].word)) hasPrev = true;
            for (let i = currentIdx + 1; i < currentSequence.length; i++) if (hasSign(currentSequence[i].word)) hasNext = true;
            prevBtn.disabled = !hasPrev;
            nextBtn.disabled = !hasNext;
        }

        function toggleFullscreenAvatar() {
            if (document.fullscreenElement) document.exitFullscreen();
            else avatarCard.requestFullscreen();
        }

        // ── Playback speed ──────────────────────────────────────────────────
        function setPlaybackSpeed(speed) {
            AvatarPlayer.setSpeed(speed);
            speedLabel.innerText = `${speed}x`;
            speedMenu.classList.add('hidden');
        }

        function showToast(msg, type = "info") {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-20 left-1/2 -translate-x-1/2 bg-gray-900 border ${type === 'error' ? 'border-rose-500' : 'border-primary-500'} text-white text-[10px] px-4 py-2 rounded-full shadow-xl z-[9999] flex gap-2 items-center font-bold`;
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        // ── Sidebar (desktop + mobile) ──────────────────────────────────────
        function initSidebar() {
            const sidebar = document.getElementById('mainSidebar');
            const closeSide = document.getElementById('sidebarCloseBtn');
            const openSide = document.getElementById('sidebarOpenBtn');
            const backdrop = document.getElementById('sidebarBackdrop');
            const isMobile = () => window.innerWidth < 768;

            function openSidebar() {
                if (isMobile()) {
                    sidebar.classList.add('mobile-open');
                    backdrop.classList.add('active');
                } else {
                    document.body.classList.remove('sidebar-collapsed');
                }
                openSide.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
                openSide.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
            }

            function closeSidebar() {
                if (isMobile()) {
                    sidebar.classList.remove('mobile-open');
                    backdrop.classList.remove('active');
                } else {
                    document.body.classList.add('sidebar-collapsed');
                }
                openSide.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
                openSide.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
            }

            closeSide.onclick = closeSidebar;
            openSide.onclick = openSidebar;
            backdrop.addEventListener('click', closeSidebar);

            // Initial sidebar state
            if (isMobile()) {
                closeSidebar(); // Starts closed on mobile, open button visible
            } else {
                // Desktop starts open, open button hidden
                openSide.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
                openSide.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
            }

            // Re-evaluate on resize
            window.addEventListener('resize', () => {
                if (!isMobile()) {
                    // Desktop: remove mobile classes
                    sidebar.classList.remove('mobile-open');
                    backdrop.classList.remove('active');
                }
            });
        }

        // ── Voice input (Cross-Browser & Microsoft Edge Compatible) ────────
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        let micRecognizer = null;
        let isListening = false;
        let isEdge = /Edg\//.test(navigator.userAgent);
        // Default to rw-RW on standard browsers, but fallback to navigator language or en-US if Edge/services fail
        let recogLang = isEdge ? (navigator.language || 'en-US') : 'rw-RW';
        let speechFallbackAttempted = false;

        function setMicState(listening) {
            isListening = listening;
            const icon = micBtn.querySelector('i');
            if (listening) {
                micBtn.classList.add('text-rose-500', 'bg-rose-500/10');
                icon.className = 'fas fa-microphone text-sm animate-pulse';
                micBtn.title = 'Listening... Click to stop';
            } else {
                micBtn.classList.remove('text-rose-500', 'bg-rose-500/10');
                icon.className = 'fas fa-microphone text-sm';
                micBtn.title = 'Speak to input text';
            }
        }

        async function requestMicPermission() {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    // Immediately release the tracks so SpeechRecognition has full hardware access
                    stream.getTracks().forEach(t => t.stop());
                    return true;
                } catch (err) {
                    console.warn('Microphone permission request:', err);
                    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                        showToast('Microphone access denied. Please click the lock icon in the Edge address bar to allow microphone access.', 'error');
                        return false;
                    }
                }
            }
            return true;
        }

        function stopListening() {
            if (micRecognizer) {
                try { micRecognizer.stop(); } catch (e) {}
                micRecognizer = null;
            }
            setMicState(false);
        }

        function startListening(fresh = true) {
            if (!SpeechRec) {
                showToast('Speech recognition is not supported in this browser. Please use Chrome or Edge.', 'error');
                return;
            }

            if (fresh) {
                speechFallbackAttempted = false;
            }

            try {
                if (micRecognizer) {
                    try { micRecognizer.abort(); } catch (e) {}
                }

                const rec = new SpeechRec();
                micRecognizer = rec;
                rec.lang = recogLang;
                rec.interimResults = false;
                rec.maxAlternatives = 1;
                rec.continuous = false;

                rec.onstart = () => {
                    setMicState(true);
                    showToast(`Listening (${recogLang})... speak now`, 'info');
                };

                rec.onresult = (e) => {
                    if (e.results && e.results[0] && e.results[0][0]) {
                        const transcript = e.results[0][0].transcript.trim();
                        if (transcript) {
                            textarea.value = transcript;
                            textarea.dispatchEvent(new Event('input'));
                            showToast(`Heard: "${transcript}"`, 'info');
                            translateText();
                        }
                    }
                };

                rec.onerror = (e) => {
                    console.warn('Speech recognition error event:', e.error);

                    // Edge frequently returns 'network' or 'language-not-supported' when an unsupported locale (like rw-RW) is used
                    if ((e.error === 'language-not-supported' || e.error === 'network' || e.error === 'service-not-allowed') && !speechFallbackAttempted) {
                        speechFallbackAttempted = true;
                        recogLang = navigator.language || 'en-US';
                        console.log('Switching speech recognition language to:', recogLang);
                        stopListening();
                        setTimeout(() => startListening(false), 250);
                        return;
                    }

                    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                        showToast('Microphone blocked. Allow microphone in Edge settings (lock icon in URL bar) and Windows Settings.', 'error');
                    } else if (e.error === 'no-speech') {
                        showToast('No speech was detected. Please try speaking again.', 'info');
                    } else if (e.error === 'audio-capture') {
                        showToast('No microphone found or it is used by another program.', 'error');
                    } else if (e.error !== 'aborted') {
                        showToast(`Speech error (${e.error}). Try again.`, 'error');
                    }

                    setMicState(false);
                };

                rec.onend = () => {
                    setMicState(false);
                };

                rec.start();
            } catch (err) {
                console.error('Speech recognition exception:', err);
                setMicState(false);
                showToast('Could not initialize speech recognition. Check microphone settings.', 'error');
            }
        }

        async function toggleMic() {
            if (isListening) {
                stopListening();
            } else {
                const allowed = await requestMicPermission();
                if (allowed) {
                    startListening(true);
                }
            }
        }

        function init() {
            dbCountSpan.innerText = `${allAnimatedWords.length} signs`;
            renderLexicon(allAnimatedWords);
            renderRecentList();
            initSidebar();
        }

        sendBtn.addEventListener('click', () => { if (isSigning) stopSigning(); else translateText(); });
        micBtn.addEventListener('click', toggleMic);
        textarea.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); translateText(); } });
        replayBtn.addEventListener('click', () => { if (currentSequence.length && hasSign(currentSequence[currentIdx].word)) { isSigning = true; setSendButtonMode(true); AvatarPlayer.playWord(currentSequence[currentIdx].word, () => playNext()); } });
        prevBtn.addEventListener('click', playPrev);
        nextBtn.addEventListener('click', playNext);
        fullscreenBtn.addEventListener('click', toggleFullscreenAvatar);
        speedBtn.addEventListener('click', (e) => { e.stopPropagation(); speedMenu.classList.toggle('hidden'); });
        document.querySelectorAll('.speed-option').forEach(opt => {
            opt.addEventListener('click', () => setPlaybackSpeed(parseFloat(opt.dataset.speed)));
        });
        document.addEventListener('click', (e) => {
            if (!speedBtn.contains(e.target) && !speedMenu.contains(e.target)) speedMenu.classList.add('hidden');
        });
        searchInput.addEventListener('input', (e) => filterLexicon(e.target.value));

        textarea.addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });

        // Fallback safety timeout for loader overlay if network hangs
        setTimeout(() => {
            if (loaderOverlay && !loaderOverlay.classList.contains('hidden')) {
                loaderOverlay.style.transition = 'opacity 0.35s ease';
                loaderOverlay.style.opacity = '0';
                setTimeout(() => { loaderOverlay.classList.add('hidden'); }, 350);
            }
        }, 12000);
        init();
    </script>
</body>
</html>
