<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TWUMVANE | 3D Avatar Sign Translator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 'sans': ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        primary: { 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        surface: { DEFAULT: '#09090b', card: '#0f1117', elevated: '#181b26', border: '#252a3a' }
                    },
                    boxShadow: {
                        'card': '0 8px 20px -6px rgba(0,0,0,0.6), 0 0 0 1px rgba(59,130,246,0.1)',
                        'glow-blue': '0 0 12px rgba(59,130,246,0.5)'
                    }
                }
            }
        }
    </script>
    <style>
        * { scrollbar-width: thin; scrollbar-color: #3b82f6 #1e1f2e; }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #0f1117; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 10px; }

        body { background: #09090b; font-family: 'Inter', sans-serif; }

        .sidebar-collapsed aside { transform: translateX(-100%); width: 0; min-width: 0; overflow: hidden; border-right: none; padding: 0; }
        .sidebar-collapsed main { margin-left: 0; }
        aside { transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1), width 0.2s; border-right: 1px solid rgba(255,255,255,0.05); }

        .chat-card {
            background: #0f1117;
            border: 1px solid #252a3a;
            transition: all 0.2s;
        }
        .chat-card:focus-within {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .lexicon-chip {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.85rem;
            border-radius: 2rem;
            font-size: 0.7rem;
            font-weight: 600;
            background: #181b26;
            color: #cbd5e6;
            border: 1px solid #2a2f42;
            transition: all 0.15s;
            cursor: pointer;
        }
        .lexicon-chip:hover { background: #252c3f; border-color: #3b82f6; color: white; transform: translateY(-1px); }

        .sequence-chip {
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            background: #181b26;
            border: 1px solid #2a2f42;
            transition: all 0.2s;
            cursor: pointer;
        }
        .sequence-chip.missing { background: rgba(244,63,94,0.12); border-color: #f43f5e40; color: #fda4af; }
        .sequence-chip.active { background: #3b82f6; border-color: #3b82f6; color: white; box-shadow: 0 4px 12px rgba(59,130,246,0.3); transform: scale(1.02); }

        textarea {
            background: transparent;
            border: none;
            outline: none;
            resize: none;
            font-size: 0.9rem;
            font-weight: 500;
            color: #f0f3fa;
            line-height: 1.5rem;
            width: 100%;
            padding: 0.5rem 0;
        }
        textarea::placeholder { color: #4a4f6e; font-weight: 450; font-size: 0.85rem; }

        .recent-item {
            transition: all 0.15s ease;
            cursor: pointer;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .recent-item:hover { background: #1e2438; transform: translateX(2px); }

        .avatar-stage {
            background: radial-gradient(ellipse at center, #10182c 0%, #05070d 70%);
            min-height: 380px;
        }
    </style>
</head>
<body class="bg-surface text-gray-200 antialiased h-screen flex overflow-hidden">

    <div class="fixed inset-0 pointer-events-none opacity-10 z-0" style="background-image: radial-gradient(#3b82f6 0.5px, transparent 0.5px); background-size: 32px 32px;"></div>

    <!-- SIDEBAR -->
    <aside id="mainSidebar" class="w-80 bg-surface-card/95 backdrop-blur-sm border-r border-surface-border flex flex-col h-full z-20 shrink-0">
        <div class="p-5 flex items-center justify-between border-b border-surface-border/60">
            <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-all active:scale-95 group">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center shadow-md group-hover:shadow-primary-500/20">
                    <i class="fas fa-robot text-white text-base"></i>
                </div>
                <div>
                    <h1 class="text-base font-extrabold tracking-tight text-white">TWUMVANE<span class="text-primary-500">·AVATAR</span></h1>
                    <p class="text-[9px] font-bold text-gray-500 tracking-wider uppercase">3D sign synthesis</p>
                </div>
            </a>
            <button id="sidebarCloseBtn" class="w-8 h-8 rounded-lg hover:bg-white/5 text-gray-400 hover:text-white transition flex items-center justify-center">
                <i class="fas fa-times text-xs"></i>
            </button>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-6 custom-scroll">
            <div>
                <div class="flex justify-between items-center mb-3 px-1">
                    <p class="text-[9px] font-black text-gray-500 uppercase tracking-wider">⚡ Animated signs</p>
                    <span id="dbSignCount" class="text-[9px] font-mono bg-primary-500/20 text-primary-400 px-2 py-0.5 rounded-full">0 terms</span>
                </div>
                <div class="relative mb-3">
                    <i class="fas fa-search absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-500 text-[9px]"></i>
                    <input type="text" id="signSearchInput" class="w-full bg-surface-elevated/60 border border-surface-border rounded-lg py-1.5 pl-8 pr-2 text-xs text-gray-200 focus:border-primary-500 outline-none transition" placeholder="Search animated signs...">
                </div>
                <div id="signsList" class="flex flex-wrap gap-1.5 max-h-48 overflow-y-auto custom-scroll pb-1">
                    <div class="text-center w-full text-[10px] text-gray-600 py-3">loading...</div>
                </div>
            </div>

            <div class="mt-2">
                <div class="flex items-center gap-2 mb-3 px-1">
                    <i class="fas fa-clock text-[9px] text-primary-500"></i>
                    <p class="text-[9px] font-black text-gray-500 uppercase tracking-wider">Recent translations</p>
                </div>
                <div id="recentTranslationsList" class="space-y-1.5 max-h-56 overflow-y-auto custom-scroll pr-1">
                    <div class="text-center text-[10px] text-gray-600 py-4 italic">No recent translations yet</div>
                </div>
            </div>
        </div>

        <div class="p-4 border-t border-surface-border/60 bg-surface-card/80">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-full bg-primary-500/10 flex items-center justify-center"><i class="fas fa-cube text-primary-400 text-[10px]"></i></div>
                <div><p class="text-[10px] font-bold">3D Avatar engine</p><p id="translationModeBadge" class="text-[9px] text-gray-500 uppercase">● ready</p></div>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden">
        <button id="sidebarOpenBtn" class="fixed top-5 left-5 z-30 w-9 h-9 rounded-xl bg-surface-elevated/90 backdrop-blur border border-surface-border shadow-lg flex items-center justify-center text-gray-300 hover:text-white hover:border-primary-500 transition-all opacity-0 scale-90 pointer-events-none">
            <i class="fas fa-bars text-sm"></i>
        </button>

        <div class="flex-1 overflow-y-auto custom-scroll p-6 md:p-10 pb-44 flex flex-col">
            <div id="mainContentCenter" class="max-w-4xl mx-auto w-full transition-all duration-500 flex flex-col my-auto">

                <!-- Avatar output card -->
                <div id="avatarCard" class="avatar-stage rounded-2xl overflow-hidden border border-surface-border shadow-2xl relative group aspect-video mb-8">
                    <div id="avatarLoaderOverlay" class="absolute inset-0 bg-black/80 backdrop-blur-sm z-20 flex flex-col items-center justify-center">
                        <div class="w-10 h-10 border-2 border-primary-500/30 border-t-primary-500 rounded-full animate-spin mb-3"></div>
                        <p class="text-[10px] font-mono text-gray-300">loading 3D avatar...</p>
                    </div>
                    <canvas id="avatarCanvas" class="w-full h-full object-contain"></canvas>
                    <div id="signMissingLabel" class="absolute inset-0 flex items-center justify-center text-gray-400 text-sm font-bold hidden px-6 text-center"></div>

                    <div class="absolute inset-x-0 bottom-0 p-4 pt-12 bg-gradient-to-t from-black/90 via-black/60 to-transparent opacity-0 group-hover:opacity-100 transition-all duration-200 pointer-events-none">
                        <div class="flex items-center justify-between pointer-events-auto">
                            <div><span class="text-[9px] font-bold text-primary-400 uppercase">current sign</span><h3 id="activeWordLabel" class="text-xl font-black tracking-tight">—</h3></div>
                            <div class="flex gap-2">
                                <button id="prevSignBtn" class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 hover:bg-primary-600 disabled:opacity-30"><i class="fas fa-chevron-left text-[10px]"></i></button>
                                <button id="replaySignBtn" class="w-9 h-9 rounded-xl bg-primary-600 shadow-md hover:bg-primary-500 flex items-center justify-center"><i class="fas fa-rotate text-xs"></i></button>
                                <button id="nextSignBtn" class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 hover:bg-primary-600 disabled:opacity-30"><i class="fas fa-chevron-right text-[10px]"></i></button>
                                <button id="fullscreenAvatarBtn" class="w-8 h-8 rounded-lg bg-white/5 border border-white/10 hover:bg-primary-600"><i class="fas fa-expand text-[10px]"></i></button>
                            </div>
                        </div>
                    </div>
                    <div class="absolute top-3 right-3 bg-black/50 backdrop-blur px-2 py-1 rounded-lg text-[9px] font-mono"><span id="signIndexIndicator">0/0</span></div>
                </div>

                <!-- Translation Path Card -->
                <div id="chipsCard" class="bg-surface-card rounded-xl border border-surface-border p-5 shadow-card transition-all">
                    <div class="flex items-center justify-center gap-2 mb-4">
                        <div class="w-1.5 h-1.5 rounded-full bg-primary-500 shadow-glow-blue"></div>
                        <span class="text-[9px] font-black text-gray-500 uppercase tracking-wider">Sign sequence</span>
                    </div>
                    <div id="sequenceChipsWrapper" class="flex flex-wrap gap-3 min-h-[70px] justify-center items-center">
                        <div class="w-full text-center text-gray-500 text-xs py-3 italic">Enter text → press send → the avatar signs each word it knows</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- BOTTOM INPUT -->
        <div class="absolute bottom-0 left-0 right-0 p-5 pt-12 bg-gradient-to-t from-surface via-surface/95 to-transparent pointer-events-none">
            <div class="max-w-3xl mx-auto w-full pointer-events-auto">
                <div class="chat-card rounded-2xl p-2 flex items-end gap-2 transition-all">
                    <div class="relative">
                        <button id="speedBtn" class="w-9 h-9 rounded-full flex items-center justify-center gap-1.5 text-gray-400 hover:text-primary-500 transition-all"><i class="fas fa-gauge-high text-sm"></i><span id="speedLabel" class="text-[9px] font-bold">1x</span></button>
                        <div id="speedMenu" class="hidden absolute bottom-10 right-0 bg-surface-elevated border border-surface-border rounded-xl shadow-2xl p-1.5 z-30 min-w-[110px]">
                            <button data-speed="0.5" class="speed-option w-full text-left px-3 py-1.5 rounded-lg text-[10px] font-bold text-gray-300 hover:bg-primary-600 hover:text-white transition">0.5x — Slow</button>
                            <button data-speed="0.75" class="speed-option w-full text-left px-3 py-1.5 rounded-lg text-[10px] font-bold text-gray-300 hover:bg-primary-600 hover:text-white transition">0.75x</button>
                            <button data-speed="1" class="speed-option w-full text-left px-3 py-1.5 rounded-lg text-[10px] font-bold text-gray-300 hover:bg-primary-600 hover:text-white transition">1x — Normal</button>
                            <button data-speed="1.25" class="speed-option w-full text-left px-3 py-1.5 rounded-lg text-[10px] font-bold text-gray-300 hover:bg-primary-600 hover:text-white transition">1.25x</button>
                            <button data-speed="1.5" class="speed-option w-full text-left px-3 py-1.5 rounded-lg text-[10px] font-bold text-gray-300 hover:bg-primary-600 hover:text-white transition">1.5x</button>
                            <button data-speed="2" class="speed-option w-full text-left px-3 py-1.5 rounded-lg text-[10px] font-bold text-gray-300 hover:bg-primary-600 hover:text-white transition">2x — Fast</button>
                        </div>
                    </div>
                    <button id="micInputBtn" class="w-9 h-9 rounded-full flex items-center justify-center text-gray-400 hover:text-primary-500 transition-all"><i class="fas fa-microphone text-sm"></i></button>
                    <textarea id="mainTextarea" rows="1" placeholder="Type a Kinyarwanda sentence... e.g. 'muraho mama'" class="flex-1 text-sm py-2 px-1 max-h-28"></textarea>
                    <button id="sendTranslateBtn" class="w-10 h-10 rounded-full bg-primary-600 hover:bg-primary-500 shadow-md flex items-center justify-center text-white transition active:scale-95">
                        <i class="fas fa-paper-plane text-sm"></i>
                    </button>
                </div>
                <p class="text-[9px] text-center text-gray-600 mt-3 font-mono tracking-wider">TWUMVANE · 3D Sign Avatar</p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="avatar.js"></script>
    <script>
        const avatarCanvas = document.getElementById('avatarCanvas');
        const signMissingLabel = document.getElementById('signMissingLabel');
        try {
            AvatarPlayer.init(avatarCanvas, 'models/twumvane.glb');
        } catch (err) {
            console.error('Avatar failed to initialize:', err);
        }

        let currentSequence = [];
        let currentIdx = 0;
        let isSigning = false;
        let recentTranslationsQueue = JSON.parse(localStorage.getItem('trsl_recent_avatar') || '[]');

        const avatarCard = document.getElementById('avatarCard');
        const loaderOverlay = document.getElementById('avatarLoaderOverlay');
        const chipsWrapper = document.getElementById('sequenceChipsWrapper');
        const textarea = document.getElementById('mainTextarea');
        const micBtn = document.getElementById('micInputBtn');
        const sendBtn = document.getElementById('sendTranslateBtn');
        const activeWordLabel = document.getElementById('activeWordLabel');
        const signIndexSpan = document.getElementById('signIndexIndicator');
        const replayBtn = document.getElementById('replaySignBtn');
        const prevBtn = document.getElementById('prevSignBtn');
        const nextBtn = document.getElementById('nextSignBtn');
        const fullscreenBtn = document.getElementById('fullscreenAvatarBtn');
        const speedBtn = document.getElementById('speedBtn');
        const speedLabel = document.getElementById('speedLabel');
        const speedMenu = document.getElementById('speedMenu');
        const dbCountSpan = document.getElementById('dbSignCount');
        const signsContainer = document.getElementById('signsList');
        const recentContainer = document.getElementById('recentTranslationsList');
        const searchInput = document.getElementById('signSearchInput');

        function hasSign(word) { return AvatarPlayer.has(word); }

        const allAnimatedWords = Object.keys(SIGN_ANIMATIONS || {});

        function renderLexicon(wordsArr) {
            if (!wordsArr.length) { signsContainer.innerHTML = '<div class="text-center w-full text-[10px] text-gray-500">no signs yet</div>'; return; }
            signsContainer.innerHTML = wordsArr.map(w => `<span class="lexicon-chip" data-word="${w}">${w}</span>`).join('');
            document.querySelectorAll('.lexicon-chip').forEach(el => {
                el.addEventListener('click', () => addToTextarea(el.getAttribute('data-word')));
            });
        }

        function filterLexicon(query) {
            if (!query.trim()) renderLexicon(allAnimatedWords);
            else renderLexicon(allAnimatedWords.filter(w => w.toLowerCase().includes(query.toLowerCase())));
        }

        function addToTextarea(word) {
            const cur = textarea.value;
            textarea.value = cur + (cur ? ' ' : '') + word;
            textarea.dispatchEvent(new Event('input'));
            textarea.focus();
        }

        function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }

        function addRecentTranslation(originalText) {
            recentTranslationsQueue = recentTranslationsQueue.filter(r => r.text !== originalText);
            const truncated = originalText.length > 40 ? originalText.slice(0, 40) + '...' : originalText;
            recentTranslationsQueue.unshift({ text: originalText, display: truncated, timestamp: Date.now() });
            if (recentTranslationsQueue.length > 10) recentTranslationsQueue.pop();
            localStorage.setItem('trsl_recent_avatar', JSON.stringify(recentTranslationsQueue));
            renderRecentList();
        }

        function renderRecentList() {
            if (recentTranslationsQueue.length === 0) {
                recentContainer.innerHTML = '<div class="text-center text-[10px] text-gray-600 py-4 italic">No recent translations</div>';
                return;
            }
            recentContainer.innerHTML = recentTranslationsQueue.map(item => `
                <div class="recent-item bg-surface-elevated/30 hover:bg-surface-elevated rounded-lg px-3 py-2 flex items-center justify-between group transition border border-transparent hover:border-surface-border">
                    <span class="text-[11px] font-medium text-gray-300 truncate max-w-[180px]">${escapeHtml(item.display)}</span>
                    <i class="fas fa-rotate-right text-[8px] text-gray-500 opacity-0 group-hover:opacity-100 transition"></i>
                </div>
            `).join('');
            document.querySelectorAll('.recent-item').forEach((el, idx) => {
                el.addEventListener('click', () => {
                    const item = recentTranslationsQueue[idx];
                    textarea.value = item.text;
                    textarea.dispatchEvent(new Event('input'));
                    translateText();
                });
            });
        }

        function setSendButtonMode(signing) {
            sendBtn.classList.toggle('bg-rose-600', signing);
            sendBtn.classList.toggle('hover:bg-rose-500', signing);
            sendBtn.classList.toggle('bg-primary-600', !signing);
            sendBtn.classList.toggle('hover:bg-primary-500', !signing);
            sendBtn.innerHTML = signing ? '<i class="fas fa-stop text-sm"></i>' : '<i class="fas fa-paper-plane text-sm"></i>';
            sendBtn.title = signing ? 'Stop signing' : 'Send to avatar';
        }

        function stopSigning() {
            isSigning = false;
            AvatarPlayer.stop();
            setSendButtonMode(false);
        }

        function translateText() {
            const rawText = textarea.value.trim();
            if (!rawText) return;
            const words = rawText.toLowerCase().split(/\s+/).filter(Boolean);
            if (!words.length) return;

            currentSequence = words.map(word => ({ word }));
            currentIdx = 0;
            signMissingLabel.classList.add('hidden');
            activeWordLabel.innerText = '';
            renderSequenceChips();
            addRecentTranslation(rawText);

            const first = findNextSignable(-1);
            if (first !== -1) playWord(first);
            else {
                signMissingLabel.classList.remove('hidden');
                signMissingLabel.innerText = `No animated signs found for "${rawText}"`;
                signIndexSpan.innerText = `0/${currentSequence.length}`;
                updateNavButtons();
            }
        }

        function renderSequenceChips() {
            if (!currentSequence.length) {
                chipsWrapper.innerHTML = `<div class="w-full text-center text-gray-500 text-xs py-3 italic">Empty sequence</div>`;
                return;
            }
            chipsWrapper.innerHTML = currentSequence.map((item, i) => `
                <div class="sequence-chip ${!hasSign(item.word) ? 'missing' : ''} ${i === currentIdx ? 'active' : ''}" data-chip-index="${i}">
                    ${item.word} ${!hasSign(item.word) ? '⚠️' : ''}
                </div>
            `).join('');
            document.querySelectorAll('.sequence-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const idx = parseInt(chip.getAttribute('data-chip-index'));
                    if (hasSign(currentSequence[idx].word)) playWord(idx);
                });
            });
        }

        function findNextSignable(fromIdx) {
            for (let i = fromIdx + 1; i < currentSequence.length; i++) {
                if (hasSign(currentSequence[i].word)) return i;
            }
            return -1;
        }

        function findPrevSignable(fromIdx) {
            for (let i = fromIdx - 1; i >= 0; i--) {
                if (hasSign(currentSequence[i].word)) return i;
            }
            return -1;
        }

        function playWord(idx) {
            if (!currentSequence[idx]) return;
            const item = currentSequence[idx];
            currentIdx = idx;
            activeWordLabel.innerText = item.word;
            signIndexSpan.innerText = `${currentIdx + 1}/${currentSequence.length}`;
            signMissingLabel.classList.add('hidden');

            const played = AvatarPlayer.playWord(item.word, () => { playNext(); });
            if (played) { isSigning = true; setSendButtonMode(true); }
            if (!played) playNext();
            updateActiveChipClass();
            updateNavButtons();
        }

        function playNext() {
            if (currentSequence.length === 0) return;
            const nxt = findNextSignable(currentIdx);
            if (nxt !== -1) playWord(nxt);
            else {
                activeWordLabel.innerText = currentSequence[currentIdx].word + ' ✓';
                isSigning = false;
                setSendButtonMode(false);
                updateNavButtons();
            }
        }

        function playPrev() {
            if (currentSequence.length === 0) return;
            const prv = findPrevSignable(currentIdx);
            if (prv !== -1) playWord(prv);
        }

        function updateActiveChipClass() {
            document.querySelectorAll('.sequence-chip').forEach((chip, i) => {
                if (i === currentIdx) chip.classList.add('active');
                else chip.classList.remove('active');
            });
        }

        function updateNavButtons() {
            let hasPrev = false, hasNext = false;
            for (let i = 0; i < currentIdx; i++) if (hasSign(currentSequence[i].word)) hasPrev = true;
            for (let i = currentIdx + 1; i < currentSequence.length; i++) if (hasSign(currentSequence[i].word)) hasNext = true;
            prevBtn.disabled = !hasPrev;
            nextBtn.disabled = !hasNext;
        }

        function toggleFullscreenAvatar() {
            if (document.fullscreenElement) document.exitFullscreen();
            else avatarCard.requestFullscreen();
        }

        // ── Playback speed ──────────────────────────────────────────────────
        function setPlaybackSpeed(speed) {
            AvatarPlayer.setSpeed(speed);
            speedLabel.innerText = `${speed}x`;
            speedMenu.classList.add('hidden');
        }

        function showToast(msg, type = "info") {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-28 left-1/2 -translate-x-1/2 bg-gray-900 border ${type === 'error' ? 'border-rose-500' : 'border-primary-500'} text-white text-[10px] px-4 py-2 rounded-full shadow-xl z-[9999] flex gap-2 items-center font-bold`;
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle'}"></i> ${msg}`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function initSidebar() {
            const closeSide = document.getElementById('sidebarCloseBtn');
            const openSide = document.getElementById('sidebarOpenBtn');
            closeSide.onclick = () => {
                document.body.classList.add('sidebar-collapsed');
                openSide.classList.remove('opacity-0', 'scale-90', 'pointer-events-none');
                openSide.classList.add('opacity-100', 'scale-100', 'pointer-events-auto');
            };
            openSide.onclick = () => {
                document.body.classList.remove('sidebar-collapsed');
                openSide.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto');
                openSide.classList.add('opacity-0', 'scale-90', 'pointer-events-none');
            };
        }

        // ── Voice input ─────────────────────────────────────────────────────
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        let micRecognizer = null;
        let isListening = false;
        let recogLang = 'rw-RW';

        function setMicState(listening) {
            isListening = listening;
            const icon = micBtn.querySelector('i');
            if (listening) {
                micBtn.classList.add('text-rose-500');
                icon.className = 'fas fa-microphone text-sm animate-pulse';
                micBtn.title = 'Listening... click to stop';
            } else {
                micBtn.classList.remove('text-rose-500');
                icon.className = 'fas fa-microphone text-sm';
                micBtn.title = 'Speak to input text';
            }
        }

        function stopListening() {
            if (micRecognizer) {
                try { micRecognizer.stop(); } catch (e) {}
                micRecognizer = null;
            }
            setMicState(false);
        }

        function startListening() {
            if (!SpeechRec) {
                showToast('Speech recognition is not supported in this browser', 'error');
                return;
            }
            try {
                const rec = new SpeechRec();
                micRecognizer = rec;
                rec.lang = recogLang;
                rec.interimResults = false;
                rec.maxAlternatives = 1;
                rec.continuous = false;

                rec.onresult = (e) => {
                    const transcript = e.results[0][0].transcript.trim();
                    if (transcript) {
                        textarea.value = transcript;
                        textarea.dispatchEvent(new Event('input'));
                        translateText();
                    }
                };

                rec.onerror = (e) => {
                    if (e.error === 'language-not-supported' && recogLang !== 'en-US') {
                        recogLang = 'en-US';
                        stopListening();
                        startListening();
                        return;
                    }
                    if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                        showToast('Microphone access was denied. Please allow it in your browser.', 'error');
                    }
                    setMicState(false);
                };

                rec.onend = () => setMicState(false);

                rec.start();
                setMicState(true);
            } catch (err) {
                console.error('Speech recognition error:', err);
                showToast('Could not start speech recognition', 'error');
            }
        }

        function toggleMic() {
            if (isListening) stopListening();
            else startListening();
        }

        function init() {
            dbCountSpan.innerText = `${allAnimatedWords.length} signs`;
            renderLexicon(allAnimatedWords);
            renderRecentList();
            initSidebar();
        }

        sendBtn.addEventListener('click', () => { if (isSigning) stopSigning(); else translateText(); });
        micBtn.addEventListener('click', toggleMic);
        textarea.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); translateText(); } });
        replayBtn.addEventListener('click', () => { if (currentSequence.length && hasSign(currentSequence[currentIdx].word)) { isSigning = true; setSendButtonMode(true); AvatarPlayer.playWord(currentSequence[currentIdx].word, () => playNext()); } });
        prevBtn.addEventListener('click', playPrev);
        nextBtn.addEventListener('click', playNext);
        fullscreenBtn.addEventListener('click', toggleFullscreenAvatar);
        speedBtn.addEventListener('click', (e) => { e.stopPropagation(); speedMenu.classList.toggle('hidden'); });
        document.querySelectorAll('.speed-option').forEach(opt => {
            opt.addEventListener('click', () => setPlaybackSpeed(parseFloat(opt.dataset.speed)));
        });
        document.addEventListener('click', (e) => {
            if (!speedBtn.contains(e.target) && !speedMenu.contains(e.target)) speedMenu.classList.add('hidden');
        });
        searchInput.addEventListener('input', (e) => filterLexicon(e.target.value));

        textarea.addEventListener('input', function () { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 120) + 'px'; });

        setTimeout(() => { loaderOverlay.classList.add('hidden'); }, 4000);
        init();
    </script>
</body>
</html>
